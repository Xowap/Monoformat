[tool.poetry]
name = "monoformat"
version = "0.2.0"
description = "A tool that formats all kinds of languages consistently"
authors = ["Rémy Sanchez <remy.sanchez@hyperthese.net>"]
license = "WTFPL"
packages = [ { include = "monoformat", from = "src" } ]
readme = "README.md"
repository = "https://github.com/Xowap/Monoformat"

[tool.poetry.scripts]
monoformat = "monoformat.__main__:__main__"

[tool.poetry.dependencies]
python = "~3.14"
isort = "^8.0.1"
black = "^26.5.1"
node-edge = "^0.1.0b2"
colorama = "^0.4.6"
pathspec = "^1.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
