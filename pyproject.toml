[project]
name = "monoformat"
version = "1.0.0"
description = "A tool that formats all kinds of languages consistently"
license = { text = "WTFPL" }
authors = [
    { name = "Rémy Sanchez", email = "remy.sanchez@hyperthese.net" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["formatter", "ruff", "prettier", "oxfmt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "ruff>=0.14",
    "node-edge>=1.0.0,<2",
    "colorama>=0.4.6",
    "pathspec>=0.12",
]

[project.optional-dependencies]
# Bundles the Node.js runtime so that Prettier/oxfmt work without a
# system-wide Node installation.
node = ["node-edge[node]>=1.0.0,<2"]

[project.scripts]
monoformat = "monoformat.__main__:__main__"

[project.urls]
Repository = "https://github.com/Xowap/Monoformat"

[dependency-groups]
dev = [
    "mypy>=1.19",
]
test = [
    "pytest>=8",
]

[tool.uv]
default-groups = ["dev", "test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monoformat"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = [
    # -- Core --
    "E",  # pycodestyle (errors)
    "W",  # pycodestyle (warnings)
    "F",  # Pyflakes
    "I",  # isort
    "C90",  # McCabe Complexity
    "D1",  # Mandatory docstrings
    "S",  # Bandit

    # -- Bonus --
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "DTZ",  # date/time zone
    "T10",  # debugger
    "EM",  # error messages
    "EXE",  # executable
    "G",  # logging
    "UP",  # pyupgrade
    "ASYNC",  # async
    "INP",  # PEP 420
    "T20",  # no print
    "PT",  # pytest
    "SLOT",  # slots
    "TC",  # type checking blocks
    "PTH",  # Use pathlib
    "FIX",  # Don't allow not done stuff in code
    "ERA",  # Don't comment code
    "RUF",  # Ruff stuff
]
ignore = [
    "D104",  # package __init__.py files don't need docstrings
    "D105",  # magic methods are self-describing
    "D106",  # nested Meta-style classes are pure configuration
    "T201",  # this is a CLI tool, printing is the point
    "S603",  # subprocess calls run our own pinned ruff binary
]

[tool.ruff.lint.per-file-ignores]
# Tests: asserts are the point, fixtures shadow args.
"tests/*" = ["S101", "D1", "ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["monoformat"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["colorama.*", "pathspec.*", "ruff.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = ["-q", "-ra", "--tb=short"]
